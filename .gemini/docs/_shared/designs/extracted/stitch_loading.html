<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UGZeroHarm Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#385486",
                        "surface-container-high": "#efe7dd",
                        "on-secondary-fixed-variant": "#534526",
                        "on-error": "#ffffff",
                        "on-surface": "#1e1b15",
                        "surface-tint": "#765a0c",
                        "surface-bright": "#fff8f2",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#d7e2ff",
                        "primary-fixed-dim": "#e8c26d",
                        "secondary-fixed": "#f6e0b6",
                        "outline": "#7f7666",
                        "primary-fixed": "#ffdf9b",
                        "tertiary-fixed-dim": "#acc7ff",
                        "tertiary": "#1f3d6d",
                        "surface": "#fff8f2",
                        "outline-variant": "#d0c5b3",
                        "on-tertiary-fixed-variant": "#294677",
                        "error": "#ba1a1a",
                        "surface-variant": "#e9e1d7",
                        "inverse-on-surface": "#f8efe5",
                        "secondary": "#6c5d3b",
                        "surface-container-highest": "#e9e1d7",
                        "on-surface-variant": "#4d4638",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#251a02",
                        "surface-container": "#f5ede3",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#251a00",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#001a40",
                        "on-primary-fixed-variant": "#5a4300",
                        "on-primary-container": "#eac46e",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#d9c49c",
                        "on-background": "#1e1b15",
                        "on-tertiary-container": "#b0c9ff",
                        "surface-dim": "#e1d9cf",
                        "surface-container-low": "#fbf2e8",
                        "secondary-container": "#f3ddb3",
                        "primary": "#4e3a00",
                        "inverse-surface": "#343029",
                        "inverse-primary": "#e8c26d",
                        "background": "#fff8f2",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#6b5000",
                        "on-primary-container": "#eac46e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "display": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        @keyframes m3-rotate {
            100% { transform: rotate(360deg); }
        }
        @keyframes m3-dash {
            0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 89, 200; stroke-dashoffset: -35px; }
            100% { stroke-dasharray: 89, 200; stroke-dashoffset: -124px; }
        }
        .m3-spinner {
            animation: m3-rotate 2s linear infinite;
        }
        .m3-spinner-circle {
            stroke-dasharray: 1, 200;
            stroke-dashoffset: 0;
            stroke-linecap: round;
            animation: m3-dash 1.5s ease-in-out infinite;
        }
        body {
            background-color: #FFFBF0; /* Explicitly requested hex */
            font-family: 'Manrope', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full flex items-center justify-center overflow-hidden">
<!-- Minimal Loading Container -->
<div class="relative flex flex-col items-center">
<!-- Material 3 Circular Progress Indicator -->
<div class="w-12 h-12">
<svg class="m3-spinner w-full h-full" viewbox="25 25 50 50">
<circle class="m3-spinner-circle" cx="50" cy="50" fill="none" r="20" stroke="#6B5000" stroke-miterlimit="10" stroke-width="4">
</circle>
</svg>
</div>
<!-- Optional micro-text to reinforce brand identity -->
<div class="mt-6 opacity-0 animate-[fadeIn_1s_ease-out_forwards_0.5s]">
<p class="text-on-surface-variant font-label text-sm tracking-widest uppercase">Initializing Safety Protocols</p>
</div>
</div>
<!-- Background Atmospheric Script -->
<script>
        // Subtle entry animation for the text
        document.addEventListener('DOMContentLoaded', () => {
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(8px); }
                    to { opacity: 0.6; transform: translateY(0); }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body></html>
